name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # publish the release and its files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # true once the repository holds an addons.mozilla.org API key
      AMO_KEY_SET: ${{ secrets.FIREFOX_JWT_ISSUER != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # a release builds from a clean install
      - run: npm ci
      - name: Headless Chromium for the layout tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Tests, holding coverage at 100%
        run: npm test
      - name: Build the userscript and zip the extensions
        run: |
          npm run build:userscript
          npm run zip
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish the release, with the changelog section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --latest \
            .output/*.zip \
            dist/gitlab-live-refresh.user.js
      - name: Submit the Firefox build to Firefox Add-ons for review
        if: env.AMO_KEY_SET == 'true'
        env:
          FIREFOX_EXTENSION_ID: gitlab-live-refresh@tomycesaille.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq -n --rawfile notes notes.md --rawfile review .github/amo-reviewer-notes.md \
            '{version: {release_notes: {"en-US": $notes}, approval_notes: $review}}' > amo.json
          npx wxt submit \
            --firefox-zip ".output/gitlab-live-refresh-$version-firefox.zip" \
            --firefox-sources-zip ".output/gitlab-live-refresh-$version-sources.zip" \
            --firefox-amo-metadata-file amo.json \
            --firefox-compatibility firefox
